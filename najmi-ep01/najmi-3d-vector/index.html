<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Najmi 3D — bentukan sama dengan 2D vector</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#141a33}
  canvas{display:block;width:100vw;height:100vh}

<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { buildSet } from '../najmi-lowpoly-v2/type-c-maskot/character.js';
import { buildGang } from './set-gang.js';
import { buildKota } from './set-kota.js';
import { buildMachi } from './set-machi.js';
import { buildKonbini } from './set-konbini.js';
import { buildLaut } from './set-laut.js';
import { buildJakartaSakura } from './set-jakarta-sakura.js';
import { buildJakartaSakura as buildJakartaSakuraV2 } from './set-jakarta-sakura-v2.js';
import { buildJakartaGhibli } from './set-jakarta-ghibli.js';
import { buildJakartaGhibli as buildJakartaGhibliV2 } from './set-jakarta-ghibli-v2.js';
import { buildJakartaRainy } from './set-jakarta-rainy.js';
import { buildJakartaRainy as buildJakartaRainyV2 } from './set-jakarta-rainy-v2.js';
import { buildBuildingsDetailed } from './set-buildings-detailed.js';
import { buildGangDetail } from './set-gang-detail.js';
import { buildKamarTidur } from './set-kamar-tidur.js';
import { buildDapur } from './set-dapur.js';
import { buildGudang } from './set-gudang.js';
import { buildPadangAruna } from './set-padang-aruna.js';
import { buildHutanEmbun } from './set-hutan-embun.js';
import { buildProps } from './set-props.js';
// Builder props satuan (28 Nov 2026, shot 'selfie'): dipakai langsung
// di meja selfie (bukan meja demo 6,4 m di set-props.js).
import { buildRamen, buildBurger } from './props-makanan.js';
import { buildCola, buildAirMineral } from './props-minuman.js';
import { buildIkan } from './props-alat.js';
import { buildRumah } from './set-rumah.js';
// KARAKTER = v9 dari kit Master (28 Nov 2026, file character-purin.js
// disalin apa adanya dari kit — hanya ditambah alias EXPRESSIONS).
// v9: kepala bulat kulit sawo matang, rambut hitam mangkuk + poni,
// badan kotak tegak membulat setinggi kepala, lengan/kaki SATU silinder,
// tanda kecil di pipi kanan, tinggi total ~1,75 m (kepala y ~1,66).
// Body Tall Tale buatan saya (1,58 m, badan bean) SUDAH DIBUANG dari
// pemakaian — filenya dipindah ke backup/character-purin-tall-tale.js.
// buildNajmi(outfit): 'bintang' (kaos putih bintang oranye) |
// 'jaket' (jaket putih + kaos marun) | 'rumah' | 'jelajah' (default).
import { buildNajmi, applyPose, SENTENCES, EXPRESSIONS } from './character-purin.js';
// Lumifox v2 (28 Nov 2026, dari kit Master — creature-lumifox.js,
// tadinya tidak ikut disalin ke workspace): rubah-kelinci chibi duduk,
// kepala besar + telinga tinggi berujung daun + ekor besar ujung mint
// bercahaya + permata mint di dahi + 3 titik cahaya di punggung.
// Pendamping Najmi (bukan kucing oren di gang). buildLumifox() ->
// { group, joints }, applyLumi(joints, 'neutral'|'curious'|'mischievous').
import { buildLumifox, applyLumi } from './creature-lumifox.js';
// Chibi detail (28 Nov 2026, Master): varian baru di character-chibi.js —
// BUKAN pengganti v9. Dipakai lewat ?char=chibi, pose + ekspresi sama.
import { buildChibi, applyChibiPose } from './character-chibi.js';
import { applySakuraStyle } from './style-sakura.js';
import { applyLeviathanStyle } from './style-leviathan.js';

const params = new URLSearchParams(location.search);
// ?char=0: tanpa karakter — hanya latar (untuk set Jakarta).
// Tidak ada lagi pilihan karakter: Purin v8 (character-purin.js) selalu
// dipakai. ?char=stick / ?char=blocky / ?char=purin diabaikan — stick dan
// blocky sudah dibuang (Master, 2026-11-27).
// Tanpa ?shot, mode ini default ke 'wide' (kamera establishing).
const noChar = params.get('char') === '0';
const isChibi = params.get('char') === 'chibi';
const shot = params.get('shot') || (noChar ? 'wide' : 'pose1');
const entry = SENTENCES.find(s => s.id === shot);
// 7 ekspresi baru (bukan bagian SENTENCES): ?shot=neutral|curious|...
// dipakai langsung sebagai nama pose. 'front'/'wide' (bukan pose, tapi
// sudut kamera) memakai pose netral. Selain itu fallback 'larangan'.
const poseName = entry ? entry.pose : (EXPRESSIONS.includes(shot) ? shot : (shot === 'selfie' ? 'happy' : (shot === 'front' || shot === 'wide' || shot === 'lumifox' ? 'neutral' : 'larangan')));
// Outfit: ?outfit=bintang | jaket | rumah | jelajah (default).
// 'bintang' = kaos putih bintang oranye, lengan tosca, celana zaitun;
// 'jaket' = jaket putih, kaos marun, jeans biru, gelang putih;
// 'rumah' = kaos oversized krem + celana charcoal + sandal + jam tangan;
// 'jelajah' = kaos krem + overshirt zaitun + cargo + sneakers + tas.
const _o = params.get('outfit');
const outfit = (_o === 'bintang' || _o === 'jaket' || _o === 'rumah' || _o === 'jelajah') ? _o : 'jelajah';
// ?roof=0: sembunyikan cangkang eksterior rumah (atap pelana + fasad +
// atap teras/carport) — mode interior/dollhouse. Default: tampil.
const showRoof = params.get('roof') !== '0';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // threejs-fundamentals: PCFSoftShadowMap deprecated r182, fallback ke PCF
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// siang (?day=1): langit terang + kabut jauh; malam: gelap + kabut dekat.
const day = params.get('day') === '1';
if (day) {
  scene.background = new THREE.Color(0x9fc8e8);
  scene.fog = new THREE.Fog(0x9fc8e8, 12, 30);
} else {
  scene.background = new THREE.Color(0x141a33);
  scene.fog = new THREE.Fog(0x141a33, 8, 16);
}
// set: ?set=lumbung (default) / gang / kota / machi / konbini / laut
//   / jakarta-sakura / jakarta-ghibli / jakarta-rainy.
// machi, konbini, laut adalah set khas per style: sakura->machi,
// rainy->konbini, leviathan->laut. Set Jakarta adalah versi Master
// (basis Indonesia, tanpa karakter — lihat ?char=0). Set & style
// tetap independen — ?style=rainy tanpa ?set tetap memakai lumbung.
// Interior diperbesar ×1,2 (Master, 28 Nov 2026): karakter v9 ~1,75 m
// membuat ruangan 6,0×5,0 / 7,0×4,6 / 5,2×4,2 m terlihat sempit di
// render — dinding + perabot ikut membesar, jadi ukuran baru:
// kamar 7,2×6,0 m (tinggi 3,84), dapur 8,4×5,52 m (3,84),
// gudang 6,24×5,04 m (4,08). Builder dipanggil dengan Group sebagai
// "scene" (mereka hanya memakai scene.add + countTriangles), lalu
// Group diskala — karakter TIDAK ikut diskala, jadi proporsi
// karakter-vs-ruangan kembali normal. Tris tidak berubah.
function buildScaledSet(scene, builder) {
  const g = new THREE.Group();
  builder(g);
  g.scale.setScalar(1.2);
  scene.add(g);
}
const setName = params.get('set') || 'lumbung';
if (setName === 'gang') buildGang(scene);
else if (setName === 'kota') buildKota(scene);
else if (setName === 'machi') buildMachi(scene);
else if (setName === 'konbini') buildKonbini(scene);
else if (setName === 'laut') buildLaut(scene);
else if (setName === 'jakarta-sakura') buildJakartaSakura(scene);
else if (setName === 'jakarta-sakura-v2') buildJakartaSakuraV2(scene);
else if (setName === 'jakarta-ghibli') buildJakartaGhibli(scene);
else if (setName === 'jakarta-ghibli-v2') buildJakartaGhibliV2(scene);
else if (setName === 'jakarta-rainy') buildJakartaRainy(scene);
else if (setName === 'jakarta-rainy-v2') buildJakartaRainyV2(scene);
else if (setName === 'buildings-detailed') buildBuildingsDetailed(scene);
else if (setName === 'gang-detail') buildGangDetail(scene);
else if (setName === 'kamar-tidur') buildScaledSet(scene, buildKamarTidur);
else if (setName === 'dapur') buildScaledSet(scene, buildDapur);
else if (setName === 'gudang') buildScaledSet(scene, buildGudang);
else if (setName === 'padang-aruna') buildPadangAruna(scene);
else if (setName === 'hutan-embun') buildHutanEmbun(scene);
else if (setName === 'props') buildProps(scene);
else if (setName === 'rumah') buildRumah(scene, showRoof);
else buildSet(scene);

// Penempatan karakter per set (posisi + kamera) — untuk set yang titik
// asalnya bukan tempat berdiri yang bagus:
// - ghibli: Najmi di atas jembatan (deck y 0.8); kamera dinaikkan +
//   didekatkan supaya pagar jembatan tidak menutupi dada + tangan terangkatnya.
// - rainy-v2: titik asal ada DI DALAM toko Indomaret (kaca depan di z 2);
//   Najmi dipindah ke trotoar depan toko (z 3.5, y 0.13) dan kamera dimundurkan.
// - gang-detail: Najmi di tengah gang yang sudah lebar (~6 m, z 2, di antara
//   warung + gerobak sate); kamera dimundurkan (z 10) supaya Najmi + kedua
//   deret rumah masuk frame tanpa sesak; gerobak sate/motor di tepi tidak
//   menutupi Najmi.
// Kamera per set ini menimpa kamera pose (pose1-pose8, front) — bukan 'wide'.
const CHAR_PLACE = {
  'jakarta-ghibli':    { pos: [0, 0.8, 0], cam: { pos: [1.0, 2.6, 3.8], look: [0, 1.2, 0] } },
  'jakarta-ghibli-v2': { pos: [0, 0.8, 0], cam: { pos: [1.0, 2.6, 3.8], look: [0, 1.2, 0] } },
  'jakarta-rainy-v2':  { pos: [0, 0.13, 3.5], cam: { pos: [0.8, 2.0, 8.5], look: [0, 1.2, 3.5] } },
  'gang-detail':       { pos: [0.3, 0, 2], cam: { pos: [-1.0, 2.2, 10], look: [0, 1.1, 2] } },
  // Interior open-front (Master, 2026-11-28): Najmi di tengah lantai,
  // kamera di luar dinding depan yang terbuka — ruangan lega masuk frame.
  'kamar-tidur':       { pos: [0, 0, 0.6], cam: { pos: [1.0, 2.4, 6.8], look: [0, 1.35, 0] } },
  'dapur':             { pos: [0, 0, 1.5], cam: { pos: [1.0, 2.4, 7.0], look: [0, 1.35, 0.5] } },
  'gudang':            { pos: [-0.55, 0, 0.3], cam: { pos: [0.5, 2.4, 6.6], look: [0, 1.4, -1.0] } },
  // Padang Aruna (Master, 28 Nov 2026): Najmi baru tiba, berdiri di
  // jalan di ujung padang (0,0,-10.5); kamera dari +z, latar belakang
  // padang + bukit. Portal dihapus seluruhnya 28 Nov 2026.
  'padang-aruna':      { pos: [0, 0, -10.5], cam: { pos: [2.0, 2.4, -2.5], look: [0, 1.3, -10.5] } },
  // Hutan Embun (28 Nov 2026): Najmi di jalur di tepi hutan (0,0,2)
  // menghadap ke dalam hutan (-z); kamera dari +z, pepohonan di
  // belakangnya. Kamera 8 m di depan Najmi seperti padang.
  'hutan-embun':       { pos: [0, 0, 2], cam: { pos: [2.0, 2.4, 10], look: [0, 1.3, 2] } },
  // Meja demo props (28 Nov 2026): Najmi berdiri di ujung kanan meja
  // (dekat pancingan), menghadap meja + kamera.
  'props':             { pos: [3.9, 0, 1.8], cam: { pos: [5.0, 2.2, 5.0], look: [3.9, 1.2, 1.8] } },
  // Rumah utuh (28 Nov 2026): Najmi di teras depan Pintu Utama.
  'rumah':            { pos: [1.8, 0, 11.5], cam: { pos: [3.0, 2.4, 15.5], look: [1.8, 1.2, 11.5] } },
};

// ?char=0: tanpa karakter — hanya latar (untuk set Jakarta).
// ?char=chibi: varian chibi detail (character-chibi.js).
if (!noChar) {
  const built = isChibi ? buildChibi(outfit) : buildNajmi(outfit);
  const { group, joints, tris } = built;
  if (isChibi) applyChibiPose(joints, poseName); else applyPose(joints, poseName);
  const cp = CHAR_PLACE[setName];
  if (cp) group.position.set(...cp.pos);
  // Lumifox (28 Nov 2026, shot 'lumifox'): pendamping Najmi, duduk di
  // samping kirinya (sedikit ke depan), menghadap kamera — hanya muncul
  // di shot 'lumifox', di set mana pun (posisi relatif ke Najmi).
  if (shot === 'lumifox') {
    const lumi = buildLumifox();
    applyLumi(lumi.joints, 'neutral');
    lumi.group.position.set(group.position.x - 1.1, 0, group.position.z + 0.4);
    scene.add(lumi.group);
    let lt = 0; lumi.group.traverse(o => { if (o.isMesh) lt += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
    console.log('TRIANGLES lumifox =', Math.round(lt));
  }
  // Selfie (28 Nov 2026, shot 'selfie' — foto profil TikTok): pose
  // dasar 'happy' (senyum + blush) lalu tangan kanan diangkat ke
  // depan-atas memegang HP (shR.x -2,1 ≈ 36° di atas horizontal;
  // siku TIDAK berpengaruh — lengan v9 SATU silinder, joint el tidak
  // terpasang ke scene). Kepala MENDONGAK ke arah kamera (headX
  // -0,35) + sedikit miring — revisi 28 Nov 2026 (Master: arah
  // kamera seperti foto referensi selfie dari atas): kamera di atas
  // menatap ke bawah, jadi Najmi menengadah ke arah HP.
  if (shot === 'selfie' && !isChibi) {
    joints.shR.rotation.set(-2.1, 0, 0.2);
    joints.head.rotation.set(-0.35, 0, 0.12);
    // HP di tangan kanan (di shR, posisi tangan y -0,45): bodi gelap
    // + layar terang di sisi +z — setelah lengan diangkat, layar
    // menghadap ke atas-belakang, ke wajah Najmi (layak selfie).
    const phone = new THREE.Group();
    const pBody = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.17, 0.012), new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.4, metalness: 0.2 }));
    pBody.castShadow = true; phone.add(pBody);
    const pScr = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.155, 0.002), new THREE.MeshStandardMaterial({ color: 0x9fd8ff, roughness: 0.3, emissive: 0x4a90c0, emissiveIntensity: 0.6 }));
    pScr.position.z = 0.007; phone.add(pScr);
    phone.position.set(0, -0.53, 0.04);
    phone.rotation.x = -0.35;
    joints.shR.add(phone);
  }
  scene.add(group);
  window.__char = { group, joints };
  console.log('TRIANGLES karakter =', tris, '— pose:', poseName, '— outfit:', outfit);
  window.TRIANGLES = tris;
}

// Meja selfie (28 Nov 2026, shot 'selfie' — foto profil TikTok):
// meja piknik bundar kayu di depan Najmi (di jalur padang, z -9,7) +
// 5 makanan di atasnya + Lumifox duduk di tepi kiri meja. Hanya
// muncul di shot 'selfie' + set padang-aruna.
if (shot === 'selfie' && setName === 'padang-aruna') {
  const wood = new THREE.MeshStandardMaterial({ color: 0x8a5f38, roughness: 0.8 });
  const woodDk = new THREE.MeshStandardMaterial({ color: 0x6b4a2a, roughness: 0.85 });
  const table = new THREE.Group(); table.position.set(0, 0, -9.7);
  const tTop = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.85, 0.05, 28), wood);
  tTop.position.y = 0.78; tTop.castShadow = tTop.receiveShadow = true; table.add(tTop);
  const tLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.75, 12), woodDk);
  tLeg.position.y = 0.375; tLeg.castShadow = true; table.add(tLeg);
  const tBase = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.36, 0.04, 20), woodDk);
  tBase.position.y = 0.02; tBase.castShadow = tBase.receiveShadow = true; table.add(tBase);
  scene.add(table);
  // Makanan (builder props, origin y=0 di alas, menghadap +z):
  // baris belakang (tinggi, tidak menutupi): air tengah, cola kanan;
  // baris depan: ramen kiri-tengah, ikan depan-tengah. (Burger TIDAK
  // di meja lagi — dipegang Lumifox (lihat blok Lumifox di bawah);
  // jadi meja berisi 4 makanan + Lumifox pegang burger.)
  const foods = [
    [buildAirMineral(), 0.35, -9.90, 0],
    [buildCola(), 0.45, -9.85, 0],
    [buildRamen(), 0.10, -9.55, 0.15],
    [buildIkan(), 0.15, -9.88, 0],
  ];
  for (const [f, x, z, ry] of foods) { f.position.set(x, 0.805, z); f.rotation.y = ry; scene.add(f); }
  // Lumifox duduk di tepi KIRI meja (x -0,45), menghadap kamera,
  // pose 'curious' (kepala miring, satu paw terangkat — lucu di selfie).
  // (Percobaan pertama: Lumifox di kanan (x +0,42) + kamera dekat
  // (z -8,7) membuatnya memenuhi separuh kanan frame dan terpotong —
  // wajahnya tidak terbaca. Kini kamera ditarik mundur + Lumifox di kiri.)
  const lumiS = buildLumifox();
  applyLumi(lumiS.joints, 'curious');
  // Lumifox MAKAN (28 Nov 2026, revisi Master: "lumifoxnya berpose
  // imut sambil makan"): pose dasar 'curious' (mulut 'o' = mengunyah,
  // kepala miring) + kedua paw diangkat ke dekat mulut (seperti
  // memegang makanan) + ekor mengibas. **KEPALA LIHAT KAMERA +
  // PEGANG BURGER (revisi 28 Nov 2026, Master: "buat kepala
  // lumifoxnya lihat ke kamera sambil pegang burger"):** kepala
  // MENDONGAK TAJAM ke arah kamera (head.x -0,55 ≈ 31° ke atas —
  // kamera ada ~51° di atas kepala Lumifox, jadi -0,15 dulu terlalu
  // datar: wajahnya menghadap ke depan, bukan ke lensa) + kepala
  // lurus ke depan (head.y 0) + badan diputar ke arah kamera
  // (group.rotation.y +0,25) supaya wajahnya tegak menghadap lensa.
  // Burger DIPEgang kedua paw (lihat di bawah) — burger di meja
  // dihapus (yang dipegang Lumifox adalah burger itu).
  lumiS.joints.head.rotation.set(-0.55, 0, 0.15);
  lumiS.joints.armL.rotation.set(-1.8, 0, 0.3);
  lumiS.joints.armR.rotation.set(-1.8, 0, -0.3);
  lumiS.joints.tail.rotation.set(0.3, 0, 0.2);
  lumiS.group.position.set(-0.15, 0.805, -9.78);
  lumiS.group.rotation.y = 0.25;
  // Burger dipegang Lumifox (28 Nov 2026, revisi Master: "sambil
  // pegang burger"): buildBurger() lalu piringnya disembunyikan
  // (piring = satu-satunya silinder r 0,11) — yang dipegang hanya
  // burgernya (r 0,058, tinggi ~0,13 m), dikecilkan 0,8× jadi
  // ~0,09 m supaya pas di paw Lumifox. Ditempel ke group Lumifox
  // di depan dada (0, 0,24, 0,20) — di antara kedua paw yang
  // terangkat (paw di (±0,10, 0,264, 0,166)) — jadi terbaca
  // dipegang kedua paw, siap digigit; sedikit dimiringkan ke arah
  // mulut (rotation.x -0,25). Burger di meja dihapus (lihat foods).
  const burgerHold = buildBurger();
  burgerHold.traverse(o => { if (o.isMesh && o.geometry.parameters && o.geometry.parameters.radiusTop === 0.11) o.visible = false; });
  burgerHold.scale.setScalar(0.8);
  burgerHold.position.set(0, 0.24, 0.20);
  burgerHold.rotation.x = -0.25;
  lumiS.group.add(burgerHold);
  scene.add(lumiS.group);
  let ltS = 0; lumiS.group.traverse(o => { if (o.isMesh) ltS += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  console.log('TRIANGLES lumifox =', Math.round(ltS));
}

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 50);
// Padang Aruna luar ruang (Master, 28 Nov 2026): bukit/desa/gunung
// 40-90 m dari kamera — fog siang default (far 30) + far plane 50
// akan menelan semuanya. Longgarkan keduanya hanya untuk set ini.
if (setName === 'padang-aruna') {
  scene.fog.far = day ? 120 : 80;
  camera.far = 150;
  camera.updateProjectionMatrix();
}
// Rumah utuh (28 Nov 2026): rumah 16 x 18 m, kamera wide ~25 m dari
// baris utara — fog siang default (far 30) menelan gudang/dapur jadi
// hantu pucat. Longgarkan ke far 70 (siang) / 45 (malam), far plane 80
// (kamera wide ditarik ke [0,15,27] setelah atap pelana ditambah).
if (setName === 'rumah') {
  scene.fog.far = day ? 70 : 45;
  camera.far = 80;
  camera.updateProjectionMatrix();
  // Shot plan (28 Nov 2026): denah dari 34 m — fog jauh (far 70) akan
  // membuat rumah ~50% berkabut. Matikan fog KHUSUS shot plan (bukan
  // global — shot lain tetap pakai far 70/45 di atas).
  if (shot === 'plan') scene.fog = null;
}
// Hutan Embun (28 Nov 2026): kabut PADAT — fog jauh lebih ketat dari
// padang (far 50 siang / 35 malam, camera.far 90). Warna latar +
// kabut disamakan ke hijau-kabut pucat supaya pepohonan jauh
// memudar ke dalam kabut, bukan tertelan hitam/biru.
if (setName === 'hutan-embun') {
  const mistCol = day ? 0xcfe3d6 : 0x101a16;
  scene.background = new THREE.Color(mistCol);
  scene.fog.color.set(mistCol);
  scene.fog.near = 10;
  scene.fog.far = day ? 50 : 35;
  camera.far = 90;

// Kamera per set Jakarta (mode tanpa karakter): 'wide' = establishing,

  // bangunan masuk frame; default 38 terlalu sempit untuk establishing).

// Style: SAKURA toon saja (Master, 2026-11-27). Ghibli + Rainy dibuang —
// ghibli bikin Najmi bersinar (bloom), rainy terlalu gelap buat rekaman.
// Default sakura supaya render tanpa ?style tetap pakai toon sakura.
// ?day=1 diteruskan ke preset supaya tiap style punya varian siang.
const style = params.get('style') || 'sakura';
let composer = null;
if (style === 'sakura') composer = applySakuraStyle(scene, renderer, camera, { day });
else if (style === 'leviathan') composer = applyLeviathanStyle(scene, renderer, camera, { day });

// Mode tanpa karakter: hitung total segitiga scene (set + style)
// supaya perkiraan builder bisa dicek di log.
if (noChar) {
  let t = 0;
  scene.traverse(o => {
    if (o.isMesh && o.geometry) {
      const g = o.geometry;
      t += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
    }
  });
  console.log('TRIANGLES scene =', Math.round(t), '— set:', setName, 'style:', style || '(tanpa style)');
}

// Mode animasi (?anim=<id segmen>): frame digambar sesuai waktu oleh
// anim.js lewat window.ANIM.frame(t) — dipanggil render-scene.mjs.
if (params.get('anim')) {
  const { setup } = await import('./anim.js');
  window.ANIM = setup({ THREE, scene, camera, renderer, composer, params, setName, applyPose, char: window.__char });
  window.ANIM.frame(window.ANIM.t0); window.ANIM.frame(window.ANIM.t0);
  window.READY = true;
} else {
let frames = 0;
  function loop() {
    if (composer) composer.render();
    else renderer.render(scene, camera);
    frames++;
    if (frames === 3) window.READY = true;
    else requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
