name: Voiceover Najmi (VoxCPM2)

# Semua logika ada di folder voiceover/. File ini hanya penempatan yang
# diwajibkan GitHub (workflow harus di .github/workflows/ di root repo).
on:
  push:
    paths:
      - 'voiceover/lines_najmi_ep03.json'
      - 'voiceover/voices.json'
      - 'voiceover/generate_voiceover.py'
      - '.github/workflows/voiceover.yml'
  workflow_dispatch:
    inputs:
      ids:
        description: 'Batasi id, mis. n01 j01 d01 (kosong = semua baris)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: voiceover-${{ github.ref }}
  cancel-in-progress: true

env:
  OMNI_REPO: 'https://github.com/tc-mb/llama.cpp-omni.git'
  GGUF_BASE: 'https://huggingface.co/DennisHuang648/VoxCPM2-GGUF/resolve/main'
  BASE_MODEL: 'VoxCPM2-BaseLM-Q8_0.gguf'
  ACOUSTIC_MODEL: 'VoxCPM2-Acoustic-F16.gguf'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pastikan build tools & ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg cmake build-essential
          fi
          cmake --version | head -n 1
          ffmpeg -version | head -n 1

      - name: Cache bobot VoxCPM2
        id: gguf-cache
        uses: actions/cache@v4
        with:
          path: .cache/voxcpm2-models
          key: voxcpm2-gguf-q8-f16-v1

      - name: Unduh GGUF (BaseLM Q8_0 + Acoustic F16)
        if: steps.gguf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/voxcpm2-models
          curl -fL --retry 3 --retry-delay 2 \
            -o ".cache/voxcpm2-models/${BASE_MODEL}" \
            "${GGUF_BASE}/${BASE_MODEL}"
          curl -fL --retry 3 --retry-delay 2 \
            -o ".cache/voxcpm2-models/${ACOUSTIC_MODEL}" \
            "${GGUF_BASE}/${ACOUSTIC_MODEL}"

      - name: Cek file model
        run: |
          test -s ".cache/voxcpm2-models/${BASE_MODEL}"
          test -s ".cache/voxcpm2-models/${ACOUSTIC_MODEL}"
          ls -lh .cache/voxcpm2-models/

      - name: Clone & build voxcpm2-cli (CPU)
        run: |
          if [ ! -d .cache/llama.cpp-omni ]; then
            git clone --depth 1 "$OMNI_REPO" .cache/llama.cpp-omni
          fi
          cmake -B .cache/llama.cpp-omni/build \
            -S .cache/llama.cpp-omni \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build .cache/llama.cpp-omni/build \
            --target voxcpm2-cli -j "$(nproc)"
          test -x .cache/llama.cpp-omni/build/bin/voxcpm2-cli

      - name: Buat voiceover per baris + MP3 gabungan
        run: |
          IDS="${{ github.event.inputs.ids || '' }}"
          ARGS=""
          if [ -n "$IDS" ]; then ARGS="--ids $IDS"; fi
          python voiceover/generate_voiceover.py $ARGS \
            --cli .cache/llama.cpp-omni/build/bin/voxcpm2-cli \
            --base-lm ".cache/voxcpm2-models/${BASE_MODEL}" \
            --acoustic ".cache/voxcpm2-models/${ACOUSTIC_MODEL}"

      - name: Ringkasan
        run: |
          ls -lh voiceover/out/voiceover_najmi_lengkap.mp3
          echo "Jumlah klip: $(find voiceover/out/voices -name '*.wav' ! -name '__*' | wc -l)"
          cat voiceover/out/dur.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: suara-najmi-${{ github.sha }}
          path: voiceover/out/
          if-no-files-found: error
          retention-days: 30
