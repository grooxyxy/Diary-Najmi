name: Voiceover Najmi (Edge TTS)

# Semua logika ada di folder voiceover/. File ini hanya penempatan yang
# diwajibkan GitHub (workflow harus di .github/workflows/ di root repo).
on:
  push:
    paths:
      - 'voiceover/lines_najmi_ep03.json'
      - 'voiceover/voices.json'
      - 'voiceover/generate_voiceover.py'
      - '.github/workflows/voiceover.yml'
  workflow_dispatch:
    inputs:
      ids:
        description: 'Batasi id, mis. n01 j01 d01 (kosong = semua baris)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: voiceover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pastikan ffmpeg tersedia
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install Edge TTS
        run: pip install edge-tts

      - name: Buat voiceover per baris + MP3 gabungan
        run: |
          IDS="${{ github.event.inputs.ids || '' }}"
          if [ -n "$IDS" ]; then
            python voiceover/generate_voiceover.py --ids $IDS
          else
            python voiceover/generate_voiceover.py
          fi

      - name: Ringkasan
        run: |
          ls -lh voiceover/out/voiceover_najmi_lengkap.mp3
          echo "Jumlah klip: $(find voiceover/out/voices -name '*.mp3' ! -name '__*' | wc -l)"
          cat voiceover/out/dur.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: suara-najmi-${{ github.sha }}
          path: voiceover/out/
          if-no-files-found: error
          retention-days: 30
